<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moben - Bem-vindo</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0101CD;--purple:#8301CD;--cyan:#01CCFF;--navy:#0C005F;--mint:#78FFD6;
  --grad:linear-gradient(135deg,#9CECFB 0%,#0052D4 50%,#8301CD 100%);
  --grad-h:linear-gradient(90deg,#9CECFB 0%,#0052D4 50%,#8301CD 100%);
  --white:#FFFFFF;--off:#F5F4FF;--off2:#EEF0FF;
  --text:#0C005F;--muted:#6B6B9A;--border:rgba(1,1,205,0.12);
  --success:#1B7F3A;--sw:240px;
}
body{font-family:'Quicksand',sans-serif;background:var(--off);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--navy);display:flex;flex-direction:column;z-index:100}
.sidebar::before{content:'';position:absolute;inset:0;opacity:0.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='30,0 60,52 0,52' fill='%239CECFB'/%3E%3C/svg%3E");background-size:60px 60px;pointer-events:none}
.sb-logo{padding:28px 24px 24px;position:relative;z-index:1;border-bottom:1px solid rgba(255,255,255,0.06)}
.sb-logo img{height:24px}
.sb-nav{flex:1;padding:16px 0;position:relative;z-index:1}
.sb-section-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.25);padding:12px 24px 6px}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.3);text-decoration:none;opacity:0.5;cursor:default}
.sb-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.sb-item.active{color:white;background:rgba(255,255,255,0.08);opacity:1}
.sb-foot{padding:20px 24px;border-top:1px solid rgba(255,255,255,0.06);position:relative;z-index:1}
.sb-user{display:flex;align-items:center;gap:10px}
.sb-avatar{width:32px;height:32px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:white;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:700;color:rgba(255,255,255,0.6);line-height:1.3}
.sb-uplan{font-size:10px;color:rgba(255,255,255,0.3);font-weight:500}

/* MAIN */
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 40px}
.tb-badge{display:inline-flex;align-items:center;gap:6px;background:var(--off2);border:1px solid var(--border);padding:4px 10px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase}
.tb-dot{width:5px;height:5px;background:var(--purple);border-radius:50%}
.content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);padding:48px;width:100%;max-width:460px;animation:fadeUp 0.35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.welcome-icon{width:52px;height:52px;background:var(--off2);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.welcome-icon svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.5}
.card-title{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;color:var(--navy);letter-spacing:-0.03em;margin-bottom:6px}
.card-sub{font-size:14px;color:var(--muted);font-weight:500;line-height:1.6;margin-bottom:32px}

/* FIELDS */
.fg{margin-bottom:20px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px}
input[type=text],input[type=tel]{width:100%;padding:12px 14px;border:1.5px solid var(--border);background:var(--white);font-family:'Quicksand',sans-serif;font-size:14px;font-weight:600;color:var(--text);outline:none;transition:border-color 0.2s,background 0.2s;-webkit-appearance:none}
input:focus{border-color:var(--blue);background:var(--off)}
.phone-wrap{display:grid;grid-template-columns:72px 1fr}
.ddi{padding:12px 8px;border:1.5px solid var(--border);border-right:none;background:var(--off);font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;color:var(--muted);outline:none;text-align:center}
.phone-input{border-left:none}
.phone-input:focus{border-left:1.5px solid var(--blue)}

/* CTA */
.cta{width:100%;padding:14px;font-family:'Quicksand',sans-serif;font-size:15px;font-weight:700;color:white;background:var(--grad-h);border:none;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(131,1,205,0.28)}
.cta:active{transform:none}
.cta:disabled{opacity:0.7;cursor:default;transform:none;box-shadow:none}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
}
</style>
</head>

      <div class="fg">
        <label for="fname">Nome completo</label>
        <input type="text" id="fname" placeholder="Joao Silva" autocomplete="name" oninput="updateAvatar(this.value)">
      </div>
      <div class="fg">
        <label for="fphone">Celular</label>
        <div class="phone-wrap">
          <select class="ddi"><option>+55</option></select>
          <input type="tel" id="fphone" class="phone-input" placeholder="(11) 99999-9999" autocomplete="tel">
        </div>
      </div>
      <button class="cta" type="button" onclick="continuar()">
        Ir para meu painel
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

<script>
function updateAvatar(v) {
  var parts = v.trim().split(' ');
  var initials = parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : (v.trim()[0] || '?').toUpperCase();
  document.getElementById('avatar').textContent = initials;
  document.getElementById('uname').textContent = v.trim() ? parts[0] : 'Completando perfil...';
}
function continuar() {
  var btn = document.querySelector('.cta');
  btn.textContent = 'Configurando seu painel...';
  btn.disabled = true;
  setTimeout(function() { window.location.href = 'dashboard.html'; }, 900);
}
</script>
