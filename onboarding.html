<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Moben — Bem-vindo</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0101CD;--purple:#8301CD;--cyan:#01CCFF;--navy:#0C005F;
  --grad-h:linear-gradient(90deg,#9CECFB 0%,#0052D4 50%,#8301CD 100%);
  --white:#fff;--off:#F5F4FF;--off2:#EEF0FF;
  --text:#0C005F;--muted:#6B6B9A;--border:rgba(1,1,205,0.12);
}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Quicksand',sans-serif;background:var(--white);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad-h)}

.logo{margin-bottom:40px}
.logo img{height:22px}

.card{width:100%;max-width:400px}

.avatar-wrap{display:flex;justify-content:center;margin-bottom:28px}
.avatar{width:64px;height:64px;background:var(--off2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;color:var(--blue);transition:all .2s}

.titulo{font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-.02em;margin-bottom:6px;text-align:center}
.sub{font-size:14px;color:var(--muted);line-height:1.6;font-weight:500;margin-bottom:32px;text-align:center}

.campo{margin-bottom:16px}
.campo label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;padding:15px 16px;border:1.5px solid var(--border);background:var(--white);font-family:'Quicksand',sans-serif;font-size:16px;font-weight:600;color:var(--text);outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0}
input:focus{border-color:var(--blue);background:var(--off)}

.tel-wrap{display:flex;gap:8px}
.ddi{padding:15px 8px;border:1.5px solid var(--border);background:var(--white);font-family:'Quicksand',sans-serif;font-size:15px;font-weight:600;color:var(--text);outline:none;cursor:pointer;-webkit-appearance:none;border-radius:0;flex-shrink:0;width:72px}
.ddi:focus{border-color:var(--blue)}
.tel-input{flex:1;padding:15px 16px;border:1.5px solid var(--border);background:var(--white);font-family:'Quicksand',sans-serif;font-size:16px;font-weight:600;color:var(--text);outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0}
.tel-input:focus{border-color:var(--blue);background:var(--off)}

.nota-tel{font-size:11px;color:var(--muted);font-weight:500;margin-top:5px;line-height:1.5}

.cta{width:100%;padding:17px;font-family:'Quicksand',sans-serif;font-size:16px;font-weight:700;color:#fff;background:var(--grad-h);border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;-webkit-tap-highlight-color:transparent;border-radius:0}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(131,1,205,.25)}
.cta:active{transform:scale(.99)}
.cta:disabled{opacity:.6;cursor:default;transform:none}
.cta svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5}

.pular{display:block;text-align:center;font-size:13px;color:var(--muted);font-weight:500;margin-top:14px;cursor:pointer;background:none;border:none;width:100%}
.pular:hover{color:var(--blue)}
</style>
</head>

<div class="card">
  <div class="avatar-wrap">
    <div class="avatar" id="avatar">?</div>
  </div>

  <h1 class="titulo">Como podemos te chamar?</h1>
  <p class="sub">Só mais dois campos e seu painel estará pronto.</p>

  <div class="campo">
    <label for="fnome">Nome completo</label>
    <input type="text" id="fnome" placeholder="João Silva" autocomplete="name" oninput="atualizarAvatar(this.value)">
  </div>

  <div class="campo">
    <label for="ftel">Celular</label>
    <div class="tel-wrap">
      <select class="ddi"><option>+55</option></select>
      <input type="tel" class="tel-input" id="ftel" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel">
    </div>
    <div class="nota-tel">Para notificações importantes sobre seus imóveis. Não compartilhamos com terceiros.</div>
  </div>

  <button class="cta" type="button" onclick="continuar()">
    Ir para meu painel
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <button class="pular" type="button" onclick="window.location.href='dashboard.html'">Preencher depois</button>
</div>

<script>
function atualizarAvatar(v) {
  var partes = v.trim().split(' ');
  var iniciais = partes.length >= 2
    ? (partes[0][0] + partes[partes.length-1][0]).toUpperCase()
    : (v.trim()[0] || '?').toUpperCase();
  document.getElementById('avatar').textContent = iniciais;
}

function continuar() {
  var btn = document.querySelector('.cta');
  btn.innerHTML = 'Preparando seu painel...<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5"><polyline points="9 18 15 12 9 6"/></svg>';
  btn.disabled = true;
  setTimeout(function(){ window.location.href = 'dashboard.html'; }, 900);
}

document.getElementById('fnome').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('ftel').focus();
});
document.getElementById('ftel').addEventListener('keydown', function(e){
  if(e.key === 'Enter') continuar();
});
</script>
</body>
</html>
